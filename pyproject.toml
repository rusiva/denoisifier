[project]
name = "denoisifier"
version = "0.1.0"
description = "Finds stripes in noisy camera intensity frames"
readme = "README.md"
authors = [
    { name = "Ruslan Ivanov", email = "ruslan.ivanov@ir-nova.se" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.4",
    "scipy-stubs>=1.17.1.5",
]

# Lint and format gate (ticket agent-gates/02). Editing this or [tool.mypy] is a gate-config
# change: owner approval (CLAUDE.md). Narrowing `select` or `include`, or adding `ignore`,
# `per-file-ignores` or `extend-exclude` entries, is a weakening move.
[tool.ruff]
line-length = 100
include = ["*.py", "*.pyi", "pyproject.toml"]  # code only; Markdown fences are not gated
src = ["src", "tests"]  # test helpers (cases, borderline, truth_match) sort as first-party
extend-exclude = [".scratch"]  # evidence records stay byte-identical (owner, 2026-11-10)

[tool.ruff.lint]
# polsigns/cadmesh's set minus S (the ticket's list), plus NPY and PT.
# RUF100 rejects unused noqa; PGH003/PGH004 reject blanket type: ignore / noqa.
select = ["E", "F", "W", "I", "UP", "B", "ARG", "PGH", "RUF", "NPY", "PT"]

[project.scripts]
denoisifier = "denoisifier.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The slow tier is `make check-slow` (-m slow). Narrowing this selection is a weakening move (CLAUDE.md).
addopts = ["-m", "not slow"]
markers = [
    "slow: long measurement runs (feasibility gate); `make check-slow`",
    "wide: seeds and cross-products beyond the inner loop's first ones (tests/inner_loop.py); deselected by make test-fast, run by make check",
    "held_out: held-out statistical calibration tests (ticket 07); slow too; excluded from make check-slow, run by make check-held-out at a ticket's close and at make measure milestones",
]
# A misspelt marker or config key, or an xfail that passes, fails the run.
strict_markers = true
strict_config = true
strict_xfail = true
filterwarnings = ["error"]
# Operating setting, agent-chosen from measured slowest steps (1.28 s idle, 7.07 s at 2x CPU
# oversubscription; ticket agent-gates/01 Comments). Thread method: a hung native call never
# returns to Python for a signal handler; the thread dumps stacks and ends the run.
# Known risk, accepted: this CPython lacks sem_clockwait, so the timer waits on CLOCK_REALTIME
# and a VM resume can fire it early. That is a false red, never a false green; port cadmesh's
# monotonic-clock conftest if it is ever seen.
timeout = 60
timeout_method = "thread"

# Type gate: strict, package only (test code out of scope until a later decision widens it).
# Inline `# mypy:` suppressions are rejected by the Makefile's no-inline-mypy step.
[tool.mypy]
strict = true  # includes warn_unused_ignores
files = ["src/denoisifier"]
enable_error_code = ["ignore-without-code"]  # mypy's own rejection of a blanket type: ignore
